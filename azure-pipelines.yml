trigger:
  branches:
    include:
      - main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'corpcompanyreg'
  imageRepository: 'financeboard'
  ACR_NAME: 'corpcompanyreg'
  SERVICE_CONNECTION: 'b8d9b6ee-f3a9-48de-95bb-5d712120a97f'
  WEB_APP_NAME: 'COMP-FINDASH-PROD'
  RG: 'corp-company'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  vmImageName: 'ubuntu-latest'
  KEEP_TAGS: '5'

stages:

  # -------------------------
  # Stage 1: BuildImage
  # -------------------------
  - stage: BuildImage
    displayName: 'BuildImage'
    jobs:
      - job: BuildImage
        displayName: 'BuildImage'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: 'Build and push image to ACR'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.BuildId)-$(Build.SourceBranchName)
                $(Build.SourceBranchName)

          - task: AzureCLI@2
            displayName: 'Clean old tags in ACR'
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                ACR_NAME="$(ACR_NAME)"
                REPO="$(imageRepository)"
                KEEP_TAGS=${KEEP_TAGS:-5}

                echo "ACR: $ACR_NAME  Repo: $REPO  Keep: $KEEP_TAGS"

                TAGS=$(az acr repository show-tags \
                  --name "$ACR_NAME" \
                  --repository "$REPO" \
                  --orderby time_desc \
                  --output tsv)

                if [[ -z "$TAGS" ]]; then
                  echo "No tags found for $REPO"
                  exit 0
                fi

                COUNT=0
                while IFS= read -r tag; do
                  if [[ "$tag" == "main" ]]; then
                    echo "Skipping protected tag: $tag"
                    continue
                  fi
                  COUNT=$((COUNT+1))
                  if (( COUNT > KEEP_TAGS )); then
                    echo "Deleting tag: $tag"
                    az acr repository untag \
                      --name "$ACR_NAME" \
                      --image "$REPO:$tag"
                  else
                    echo "Keeping tag: $tag"
                  fi
                done <<<"$TAGS"

                echo "Cleanup complete."

  # -------------------------
  # Stage 2: RestartApp
  # -------------------------
  - stage: RestartApp
    displayName: 'RestartApp'
    dependsOn: BuildImage
    condition: succeeded()
    jobs:
      - job: RestartApp
        displayName: 'Restart WebApp'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Restart WebApp'
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Restarting WebApp: $(WEB_APP_NAME)"
                az webapp restart \
                  --name $(WEB_APP_NAME) \
                  --resource-group $(RG)

  # -------------------------
  # Stage 3: CFNetworkRestrictions
  # -------------------------
  - stage: CFNetworkRestrictions
    displayName: '3 · Apply Cloudflare IP Restrictions'
    dependsOn: RestartApp
    condition: succeeded()
    jobs:
      - job: ApplyCFRestrictions
        displayName: 'Sync Cloudflare CIDRs to App Service'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Validate and sync Cloudflare IP restrictions'
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                echo "Fetching Cloudflare IP ranges from api.cloudflare.com..."
                CF_RESPONSE=$(curl -sf "https://api.cloudflare.com/client/v4/ips")
                if [ $? -ne 0 ] || [ -z "$CF_RESPONSE" ]; then
                  echo "##[error] Failed to fetch Cloudflare IPs — aborting."
                  exit 1
                fi

                SUCCESS=$(echo "$CF_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success','false'))")
                if [ "$SUCCESS" != "True" ]; then
                  echo "##[error] Cloudflare API returned success=false — aborting."
                  exit 1
                fi

                IPV4=$(echo "$CF_RESPONSE" | python3 -c "
                import sys, json
                for ip in json.load(sys.stdin)['result']['ipv4_cidrs']:
                    print(ip)
                ")

                IPV6=$(echo "$CF_RESPONSE" | python3 -c "
                import sys, json
                for ip in json.load(sys.stdin)['result']['ipv6_cidrs']:
                    print(ip)
                ")

                ALL_CF_IPS=$(printf '%s\n%s' "$IPV4" "$IPV6" | grep -v '^$')
                CF_COUNT=$(echo "$ALL_CF_IPS" | wc -l | tr -d ' ')
                echo "Fetched $CF_COUNT Cloudflare CIDRs (IPv4 + IPv6)"

                echo ""
                echo "Reading existing access restrictions on $(WEB_APP_NAME)..."
                EXISTING=$(az webapp config access-restriction show \
                  --name $(WEB_APP_NAME) \
                  --resource-group $(RG) \
                  --query "ipSecurityRestrictions[].ipAddress" \
                  --output tsv 2>/dev/null || echo "")

                echo ""
                echo "Validating all CF IPs are present:"
                MISSING_IPS=""
                while IFS= read -r IP; do
                  [ -z "$IP" ] && continue
                  if echo "$EXISTING" | grep -qF "$IP"; then
                    echo "  [OK]      $IP"
                  else
                    echo "  [MISSING] $IP"
                    MISSING_IPS=$(printf '%s\n%s' "$MISSING_IPS" "$IP")
                  fi
                done <<< "$ALL_CF_IPS"

                MISSING_IPS=$(echo "$MISSING_IPS" | grep -v '^$' || true)

                if [ -z "$MISSING_IPS" ]; then
                  echo ""
                  echo "All $CF_COUNT Cloudflare IPs are already present. No changes needed."
                  exit 0
                fi

                MISSING_COUNT=$(echo "$MISSING_IPS" | wc -l | tr -d ' ')
                echo ""
                echo "$MISSING_COUNT CF IP(s) missing — adding now..."

                MAX_PRI=$(az webapp config access-restriction show \
                  --name $(WEB_APP_NAME) \
                  --resource-group $(RG) \
                  --query "max(ipSecurityRestrictions[?priority < \`1000\`].priority)" \
                  --output tsv 2>/dev/null || echo "")

                if [ -z "$MAX_PRI" ] || [ "$MAX_PRI" = "None" ]; then
                  NEXT_PRI=100
                else
                  NEXT_PRI=$((MAX_PRI + 1))
                fi

                while IFS= read -r IP; do
                  [ -z "$IP" ] && continue
                  RULE_NAME="CF-$(echo "$IP" | tr '/.:' '---' | cut -c1-32)"
                  echo "  Adding $IP as '$RULE_NAME' (priority $NEXT_PRI)..."
                  az webapp config access-restriction add \
                    --name $(WEB_APP_NAME) \
                    --resource-group $(RG) \
                    --rule-name "$RULE_NAME" \
                    --action Allow \
                    --ip-address "$IP" \
                    --priority $NEXT_PRI \
                    --output none
                  echo "  Added: $IP"
                  NEXT_PRI=$((NEXT_PRI + 1))
                done <<< "$MISSING_IPS"

                echo ""
                echo "CF restriction sync complete. Added $MISSING_COUNT new rule(s)."

  # -------------------------
  # Stage 4: Telegram Success
  # -------------------------
  - stage: TelegramSuccess
    displayName: 'Telegram Success'
    dependsOn:
      - BuildImage
      - RestartApp
      - CFNetworkRestrictions
    condition: and(succeeded('BuildImage'), succeeded('RestartApp'), succeeded('CFNetworkRestrictions'))
    jobs:
      - job: NotifySuccess
        displayName: 'Send Success Notification'
        pool:
          vmImage: $(vmImageName)
        steps:
          - script: |
              export STATUS="SUCCESS"
              export PIPELINE="$(Build.DefinitionName)"
              export BRANCH="$(Build.SourceBranchName)"
              export CHAT_ID="$(CHAT_ID)"
              export BOT="$(BOT_TOKEN)"
              export DEPLOY_TIME=$(date +"%Y-%m-%d %H:%M:%S")
              export COMMIT_AUTHOR=$(git log --format='%an' -n 1)
              export BUILD_ID="$(Build.BuildId)"
              export BUILD_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
              bash $PWD/bin/tlg_notification.sh
            displayName: 'Notify Success'

  # -------------------------
  # Stage 5: Telegram Failure
  # -------------------------
  - stage: TelegramFailure
    displayName: 'Telegram Failure'
    dependsOn:
      - BuildImage
      - RestartApp
      - CFNetworkRestrictions
    condition: or(failed('BuildImage'), failed('RestartApp'), failed('CFNetworkRestrictions'))
    jobs:
      - job: NotifyFailure
        displayName: 'Send Failure Notification'
        pool:
          vmImage: $(vmImageName)
        steps:
          - script: |
              export STATUS="FAILED"
              export PIPELINE="$(Build.DefinitionName)"
              export BRANCH="$(Build.SourceBranchName)"
              export CHAT_ID="$(CHAT_ID)"
              export BOT="$(BOT_TOKEN)"
              export DEPLOY_TIME=$(date +"%Y-%m-%d %H:%M:%S")
              export COMMIT_AUTHOR=$(git log --format='%an' -n 1)
              export BUILD_ID="$(Build.BuildId)"
              export BUILD_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
              bash $PWD/bin/tlg_notification.sh
            displayName: 'Notify Failure'

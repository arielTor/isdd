trigger:
  branches:
    include:
      - main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'corpcompanyreg'
  imageRepository: 'financeboard'
  ACR_NAME: 'corpcompanyreg'
  SERVICE_CONNECTION: 'b8d9b6ee-f3a9-48de-95bb-5d712120a97f'
  WEB_APP_NAME: 'COMP-FINDASH-PROD'
  RG: 'corp-company'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  vmImageName: 'ubuntu-latest'
  KEEP_TAGS: '5'
  # CF domain setup — set DOMAINS and CF_ZONE_ID as pipeline variables in Azure DevOps
  # DOMAINS format: "app.example.com www.example.com subdomain.other.com@zone_id_for_other"
  # CF_API_TOKEN: set as secret pipeline variable

stages:

  # -------------------------
  # Stage 1: BuildImage
  # -------------------------
  - stage: BuildImage
    displayName: 'BuildImage'
    jobs:
      - job: BuildImage
        displayName: 'BuildImage'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: 'Build and push image to ACR'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.BuildId)-$(Build.SourceBranchName)
                $(Build.SourceBranchName)

          - task: AzureCLI@2
            displayName: 'Clean old tags in ACR'
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                ACR_NAME="$(ACR_NAME)"
                REPO="$(imageRepository)"
                KEEP_TAGS=${KEEP_TAGS:-5}

                echo "ACR: $ACR_NAME  Repo: $REPO  Keep: $KEEP_TAGS"

                TAGS=$(az acr repository show-tags \
                  --name "$ACR_NAME" \
                  --repository "$REPO" \
                  --orderby time_desc \
                  --output tsv)

                if [[ -z "$TAGS" ]]; then
                  echo "No tags found for $REPO"
                  exit 0
                fi

                COUNT=0
                while IFS= read -r tag; do
                  if [[ "$tag" == "main" ]]; then
                    echo "Skipping protected tag: $tag"
                    continue
                  fi
                  COUNT=$((COUNT+1))
                  if (( COUNT > KEEP_TAGS )); then
                    echo "Deleting tag: $tag"
                    az acr repository untag \
                      --name "$ACR_NAME" \
                      --image "$REPO:$tag"
                  else
                    echo "Keeping tag: $tag"
                  fi
                done <<<"$TAGS"

                echo "Cleanup complete."

  # -------------------------
  # Stage 2: RestartApp
  # -------------------------
  - stage: RestartApp
    displayName: 'RestartApp'
    dependsOn: BuildImage
    condition: succeeded()
    jobs:
      - job: RestartApp
        displayName: 'Restart WebApp'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Restart WebApp'
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Restarting WebApp: $(WEB_APP_NAME)"
                az webapp restart \
                  --name $(WEB_APP_NAME) \
                  --resource-group $(RG)

  # -------------------------
  # Stage 3: CFOriginCert
  # -------------------------
  - stage: CFOriginCert
    displayName: '3 · CF Origin Cert & Domain TLS'
    dependsOn: RestartApp
    condition: succeeded()
    jobs:
      - job: CertSetup
        displayName: 'Bind domains, upload certs, enable CF proxy'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Setup CF origin certificates and domain bindings'
            env:
              CF_API_TOKEN: $(CF_API_TOKEN)
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                WEBAPP="$(WEB_APP_NAME)"
                RG="$(RG)"
                DEFAULT_ZONE="$(CF_ZONE_ID)"
                DOMAINS_INPUT="$(DOMAINS)"

                echo "Domains to process: $DOMAINS_INPUT"
                echo ""

                # ── 1. Parse domains and group by CF zone ──────────────────────
                export DOMAINS_INPUT DEFAULT_ZONE
                python3 - << 'PYEOF' > /tmp/zone_groups.json
                import json, os
                di = os.environ['DOMAINS_INPUT']
                dz = os.environ['DEFAULT_ZONE']
                groups = {}
                for entry in di.split():
                    entry = entry.strip()
                    if not entry:
                        continue
                    if '@' in entry:
                        dom, zone = entry.rsplit('@', 1)
                    else:
                        dom, zone = entry, dz
                    groups.setdefault(zone, []).append(dom)
                print(json.dumps(groups))
                PYEOF

                ZONES=$(python3 -c "import json; print(' '.join(json.load(open('/tmp/zone_groups.json')).keys()))")
                echo "CF zones to process: $(echo $ZONES | wc -w)"
                echo ""

                # ── 2. Per zone: check existing cert, create + upload if needed ─
                > /tmp/zone_thumbprints.txt
                THRESHOLD=$(date -d '+30 days' '+%Y-%m-%dT%H:%M:%S')

                for ZONE_ID in $ZONES; do
                  ZONE_DOMS=$(python3 -c "
                import json
                print(' '.join(json.load(open('/tmp/zone_groups.json')).get('$ZONE_ID', [])))
                ")
                  FIRST_DOM=$(echo "$ZONE_DOMS" | awk '{print $1}')
                  # For subdomains, use root domain — the wildcard cert covers them
                  FIRST_ROOT=$(python3 -c "p='$FIRST_DOM'.split('.'); print('.'.join(p[-2:]) if len(p)>2 else '$FIRST_DOM')")

                  echo "=== Zone: $ZONE_ID ==="
                  echo "    Domains: $ZONE_DOMS"
                  echo "    Cert root: $FIRST_ROOT"

                  # Check for a valid non-expiring cert for this root already on Azure
                  THUMBPRINT=$(az webapp config ssl list \
                    --resource-group "$RG" \
                    --query "[?contains(subjectName,'$FIRST_ROOT') && expirationDate > '$THRESHOLD'].thumbprint | [0]" \
                    --output tsv 2>/dev/null || echo "")

                  if [ -n "$THUMBPRINT" ] && [ "$THUMBPRINT" != "None" ]; then
                    echo "    [OK] Valid cert exists (thumbprint: $THUMBPRINT) — skipping creation"
                    echo "$ZONE_ID=$THUMBPRINT" >> /tmp/zone_thumbprints.txt
                    continue
                  fi

                  echo "    No valid cert found — creating CF origin certificate..."

                  # Cert covers root domain + wildcard (one cert handles all subdomains)
                  HOSTNAMES_JSON=$(python3 -c "
                import json
                doms = '$ZONE_DOMS'.split()
                roots = set()
                for d in doms:
                    p = d.split('.')
                    roots.add('.'.join(p[-2:]) if len(p) > 2 else d)
                h = []
                for r in sorted(roots):
                    h += [r, '*.' + r]
                print(json.dumps(h))
                ")
                  echo "    Hostnames in cert: $HOSTNAMES_JSON"

                  CF_HTTP=$(curl -s -o /tmp/cf_cert.json -w "%{http_code}" \
                    -X POST "https://api.cloudflare.com/client/v4/certificates" \
                    -H "Authorization: Bearer $CF_API_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data "{\"hostnames\": $HOSTNAMES_JSON, \"requested_validity\": 5475, \"request_type\": \"origin-rsa\"}")
                  CERT_RESPONSE=$(cat /tmp/cf_cert.json); rm -f /tmp/cf_cert.json

                  if [ "$CF_HTTP" -ge 400 ]; then
                    echo "##[error] CF API returned HTTP $CF_HTTP — full response:"
                    echo "$CERT_RESPONSE"
                    exit 1
                  fi

                  CF_SUCCESS=$(echo "$CERT_RESPONSE" | python3 -c \
                    "import sys,json; print(json.load(sys.stdin).get('success', False))")

                  if [ "$CF_SUCCESS" != "True" ]; then
                    echo "##[error] CF certificate creation failed for zone $ZONE_ID:"
                    echo "$CERT_RESPONSE" | python3 -c \
                      "import sys,json; [print(e) for e in json.load(sys.stdin).get('errors',[])]"
                    exit 1
                  fi

                  CF_CERT=$(echo "$CERT_RESPONSE" | python3 -c \
                    "import sys,json; print(json.load(sys.stdin)['result']['certificate'])")
                  CF_KEY=$(echo "$CERT_RESPONSE" | python3 -c \
                    "import sys,json; print(json.load(sys.stdin)['result']['private_key'])")
                  CF_CERT_ID=$(echo "$CERT_RESPONSE" | python3 -c \
                    "import sys,json; print(json.load(sys.stdin)['result']['id'])")
                  echo "    CF cert created (id: $CF_CERT_ID)"

                  printf '%s' "$CF_CERT" > /tmp/cf-cert.pem
                  printf '%s' "$CF_KEY"  > /tmp/cf-key.pem
                  CERT_PASS=$(openssl rand -hex 20)

                  # Convert PEM → PFX (Azure requires PFX format)
                  openssl pkcs12 -export \
                    -out /tmp/cf-cert.pfx -inkey /tmp/cf-key.pem -in /tmp/cf-cert.pem \
                    -passout "pass:$CERT_PASS" -legacy 2>/dev/null || \
                  openssl pkcs12 -export \
                    -out /tmp/cf-cert.pfx -inkey /tmp/cf-key.pem -in /tmp/cf-cert.pem \
                    -passout "pass:$CERT_PASS"

                  THUMBPRINT=$(az webapp config ssl upload \
                    --certificate-file /tmp/cf-cert.pfx \
                    --certificate-password "$CERT_PASS" \
                    --name "$WEBAPP" \
                    --resource-group "$RG" \
                    --query thumbprint \
                    --output tsv)
                  echo "    Cert uploaded (thumbprint: $THUMBPRINT)"

                  rm -f /tmp/cf-cert.pem /tmp/cf-key.pem /tmp/cf-cert.pfx

                  echo "$ZONE_ID=$THUMBPRINT" >> /tmp/zone_thumbprints.txt
                  echo ""
                done

                echo "=== Cert upload phase complete ==="
                echo ""

                # ── 3. Per domain: add DNS records, bind hostname, SNI cert, enable CF proxy ────

                # Get Azure webapp details once — used for CNAME target and TXT verification
                VERIFY_ID=$(az webapp show \
                  --name "$WEBAPP" --resource-group "$RG" \
                  --query customDomainVerificationId --output tsv)
                WEBAPP_DEFAULT=$(az webapp show \
                  --name "$WEBAPP" --resource-group "$RG" \
                  --query defaultHostName --output tsv)
                echo "Azure verification ID: $VERIFY_ID"
                echo "Webapp default hostname: $WEBAPP_DEFAULT"
                echo ""

                for ENTRY in $DOMAINS_INPUT; do
                  if [[ "$ENTRY" == *"@"* ]]; then
                    DOM="${ENTRY%@*}"
                    ZONE_ID="${ENTRY#*@}"
                  else
                    DOM="$ENTRY"
                    ZONE_ID="$DEFAULT_ZONE"
                  fi

                  THUMBPRINT=$(grep "^$ZONE_ID=" /tmp/zone_thumbprints.txt 2>/dev/null | cut -d'=' -f2 || echo "")

                  echo "--- $DOM ---"

                  # Step 1: Ensure asuid TXT record for Azure domain ownership verification
                  TXT_NAME="asuid.$DOM"
                  TXT_HTTP=$(curl -s -o /tmp/cf_txt.json -w "%{http_code}" \
                    "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=TXT&name=$TXT_NAME" \
                    -H "Authorization: Bearer $CF_API_TOKEN")
                  if [ "$TXT_HTTP" -ge 400 ]; then
                    echo "##[error] CF API error $TXT_HTTP checking TXT records:"
                    cat /tmp/cf_txt.json; rm -f /tmp/cf_txt.json; exit 1
                  fi
                  TXT_RESP=$(cat /tmp/cf_txt.json); rm -f /tmp/cf_txt.json
                  TXT_COUNT=$(echo "$TXT_RESP" | python3 -c \
                    "import sys,json; print(len(json.load(sys.stdin).get('result',[])))")

                  if [ "$TXT_COUNT" = "0" ]; then
                    echo "  Creating TXT record $TXT_NAME..."
                    TXT_POST_HTTP=$(curl -s -o /tmp/cf_txt_post.json -w "%{http_code}" -X POST \
                      "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                      -H "Authorization: Bearer $CF_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data "{\"type\":\"TXT\",\"name\":\"$TXT_NAME\",\"content\":\"$VERIFY_ID\",\"ttl\":1}")
                    if [ "$TXT_POST_HTTP" -ge 400 ]; then
                      echo "##[error] CF API error $TXT_POST_HTTP creating TXT record:"
                      cat /tmp/cf_txt_post.json; rm -f /tmp/cf_txt_post.json; exit 1
                    fi
                    rm -f /tmp/cf_txt_post.json
                    echo "  TXT record created — waiting 30s for DNS propagation..."
                    sleep 30
                  else
                    echo "  [OK] TXT record already exists for $TXT_NAME"
                  fi

                  # Step 2: Ensure CNAME record exists (DNS-only initially so Azure can verify)
                  DNS_HTTP=$(curl -s -o /tmp/cf_dns.json -w "%{http_code}" \
                    "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$DOM" \
                    -H "Authorization: Bearer $CF_API_TOKEN")
                  if [ "$DNS_HTTP" -ge 400 ]; then
                    echo "##[error] CF API error $DNS_HTTP checking DNS records:"
                    cat /tmp/cf_dns.json; rm -f /tmp/cf_dns.json; exit 1
                  fi
                  DNS_RESP=$(cat /tmp/cf_dns.json); rm -f /tmp/cf_dns.json
                  RECORD_COUNT=$(echo "$DNS_RESP" | python3 -c \
                    "import sys,json; print(len(json.load(sys.stdin).get('result',[])))")

                  if [ "$RECORD_COUNT" = "0" ]; then
                    echo "  Creating CNAME $DOM → $WEBAPP_DEFAULT (DNS-only)..."
                    CNAME_HTTP=$(curl -s -o /tmp/cf_cname.json -w "%{http_code}" -X POST \
                      "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                      -H "Authorization: Bearer $CF_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data "{\"type\":\"CNAME\",\"name\":\"$DOM\",\"content\":\"$WEBAPP_DEFAULT\",\"ttl\":1,\"proxied\":false}")
                    if [ "$CNAME_HTTP" -ge 400 ]; then
                      echo "##[error] CF API error $CNAME_HTTP creating CNAME record:"
                      cat /tmp/cf_cname.json; rm -f /tmp/cf_cname.json; exit 1
                    fi
                    rm -f /tmp/cf_cname.json
                    echo "  CNAME record created"
                    # Re-fetch so the proxy step below has the record ID
                    DNS_RESP=$(curl -s \
                      "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$DOM" \
                      -H "Authorization: Bearer $CF_API_TOKEN")
                  else
                    echo "  [OK] DNS record already exists for $DOM"
                  fi

                  # Step 3: Bind hostname to Azure webapp
                  BOUND=$(az webapp config hostname list \
                    --webapp-name "$WEBAPP" \
                    --resource-group "$RG" \
                    --query "[?name=='$DOM'].name" \
                    --output tsv 2>/dev/null || echo "")

                  if [ -n "$BOUND" ]; then
                    echo "  [OK] Hostname already bound"
                  else
                    echo "  Binding hostname $DOM..."
                    az webapp config hostname add \
                      --webapp-name "$WEBAPP" \
                      --resource-group "$RG" \
                      --hostname "$DOM"
                    echo "  Hostname bound"
                  fi

                  # Step 4: Bind cert (SNI) if we have a thumbprint for this zone
                  if [ -n "$THUMBPRINT" ]; then
                    HAS_BINDING=$(az webapp show \
                      --name "$WEBAPP" \
                      --resource-group "$RG" \
                      --query "hostNameSslStates[?name=='$DOM' && sslState=='SniEnabled' && thumbprint=='$THUMBPRINT'].name | [0]" \
                      --output tsv 2>/dev/null || echo "")

                    if [ -n "$HAS_BINDING" ] && [ "$HAS_BINDING" != "None" ]; then
                      echo "  [OK] SNI binding already set for $DOM"
                    else
                      echo "  Binding cert to $DOM (SNI)..."
                      az webapp config ssl bind \
                        --certificate-thumbprint "$THUMBPRINT" \
                        --ssl-type SNI \
                        --name "$WEBAPP" \
                        --resource-group "$RG" \
                        --hostname "$DOM" \
                        --output none
                      echo "  SNI binding created"
                    fi
                  else
                    echo "  ##[warning] No thumbprint for zone $ZONE_ID — skipping cert bind"
                  fi

                  # Step 5: Enable CF proxy
                  IS_PROXIED=$(echo "$DNS_RESP" | python3 -c \
                    "import sys,json; print(json.load(sys.stdin)['result'][0]['proxied'])")

                  if [ "$IS_PROXIED" = "True" ]; then
                    echo "  [OK] CF proxy already enabled"
                  else
                    RECORD_ID=$(echo "$DNS_RESP" | python3 -c \
                      "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
                    REC_TYPE=$(echo "$DNS_RESP" | python3 -c \
                      "import sys,json; print(json.load(sys.stdin)['result'][0]['type'])")
                    REC_NAME=$(echo "$DNS_RESP" | python3 -c \
                      "import sys,json; print(json.load(sys.stdin)['result'][0]['name'])")
                    REC_CONTENT=$(echo "$DNS_RESP" | python3 -c \
                      "import sys,json; print(json.load(sys.stdin)['result'][0]['content'])")

                    PROXY_HTTP=$(curl -s -o /tmp/cf_proxy.json -w "%{http_code}" -X PUT \
                      "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                      -H "Authorization: Bearer $CF_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data "{\"type\":\"$REC_TYPE\",\"name\":\"$REC_NAME\",\"content\":\"$REC_CONTENT\",\"ttl\":1,\"proxied\":true}")
                    if [ "$PROXY_HTTP" -ge 400 ]; then
                      echo "##[error] CF API error $PROXY_HTTP enabling proxy:"
                      cat /tmp/cf_proxy.json; rm -f /tmp/cf_proxy.json; exit 1
                    fi
                    rm -f /tmp/cf_proxy.json
                    echo "  CF proxy enabled"
                  fi

                  echo ""
                done

                rm -f /tmp/zone_groups.json /tmp/zone_thumbprints.txt
                echo "=== CF origin cert setup complete for all domains ==="

  # -------------------------
  # Stage 4: Telegram Success
  # -------------------------
  - stage: TelegramSuccess
    displayName: 'Telegram Success'
    dependsOn:
      - BuildImage
      - RestartApp
      - CFOriginCert
    condition: and(succeeded('BuildImage'), succeeded('RestartApp'), succeeded('CFOriginCert'))
    jobs:
      - job: NotifySuccess
        displayName: 'Send Success Notification'
        pool:
          vmImage: $(vmImageName)
        steps:
          - script: |
              export STATUS="SUCCESS"
              export PIPELINE="$(Build.DefinitionName)"
              export BRANCH="$(Build.SourceBranchName)"
              export CHAT_ID="$(CHAT_ID)"
              export BOT="$(BOT_TOKEN)"
              export DEPLOY_TIME=$(date +"%Y-%m-%d %H:%M:%S")
              export COMMIT_AUTHOR=$(git log --format='%an' -n 1)
              export BUILD_ID="$(Build.BuildId)"
              export BUILD_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
              bash $PWD/bin/tlg_notification.sh
            displayName: 'Notify Success'

  # -------------------------
  # Stage 5: Telegram Failure
  # -------------------------
  - stage: TelegramFailure
    displayName: 'Telegram Failure'
    dependsOn:
      - BuildImage
      - RestartApp
      - CFOriginCert
    condition: or(failed('BuildImage'), failed('RestartApp'), failed('CFOriginCert'))
    jobs:
      - job: NotifyFailure
        displayName: 'Send Failure Notification'
        pool:
          vmImage: $(vmImageName)
        steps:
          - script: |
              export STATUS="FAILED"
              export PIPELINE="$(Build.DefinitionName)"
              export BRANCH="$(Build.SourceBranchName)"
              export CHAT_ID="$(CHAT_ID)"
              export BOT="$(BOT_TOKEN)"
              export DEPLOY_TIME=$(date +"%Y-%m-%d %H:%M:%S")
              export COMMIT_AUTHOR=$(git log --format='%an' -n 1)
              export BUILD_ID="$(Build.BuildId)"
              export BUILD_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
              bash $PWD/bin/tlg_notification.sh
            displayName: 'Notify Failure'
